<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feliks Kolomoiets – Portfolio und Lebenslauf</title>
  <meta name="description" content="Portfolio und Lebenslauf von Feliks Kolomoiets, Regensburg.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip" href="#main" data-t="skip">Zum Inhalt springen</a>

  <header class="hero" id="top">
    <h1 class="hero-title">
      <span class="sr-only">Feliks Kolomoiets</span>
      <span class="word" aria-hidden="true"><span class="word-in"><span class="ch">f</span><span class="ch">e</span><span class="ch">l</span><span class="ch">i</span><span class="ch ch-k">k</span><span class="ch ch-s">s</span><span class="ch ch-x">x</span></span></span>
    </h1>

    <div class="water">
      <canvas class="ink" role="img" data-ink-label aria-label="Tinte im Wasser"></canvas>
      <svg class="ink-still" viewBox="0 0 1600 700" preserveAspectRatio="xMinYMin slice" aria-hidden="true" focusable="false">
        <defs>
          <filter id="billow" x="-30%" y="-10%" width="160%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="4" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="1.5"/>
          </filter>
          <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#052385"/>
            <stop offset=".3" stop-color="#2358FC"/>
            <stop offset=".75" stop-color="#8C9DEF" stop-opacity=".75"/>
            <stop offset="1" stop-color="#C6D1F1" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g filter="url(#billow)" fill="url(#col)" data-still></g>
      </svg>
      <span class="waterline" aria-hidden="true"></span>
    </div>

    <p class="spread"><span data-t="spread0">Portfolio</span> <span data-t="spread1">und</span> <span data-t="spread2">Lebenslauf</span></p>

    <div class="smallprint" aria-hidden="true">
      <p class="sp-block"><span>Feliks</span><span>Kolomoiets</span></p>
      <p class="sp-date"><span data-city>Regensburg</span> 2026 11</p>
    </div>
    <div class="lang lang-hero" role="group" aria-label="Sprache wählen" data-lang-group></div>
  </header>

  <main id="main" tabindex="-1">
    <section class="sec" id="about" aria-labelledby="h-about">
      <div class="sec-head"><h2 class="sec-word" id="h-about" data-h="about">über mich</h2></div>
      <div class="grid about">
        <figure class="dive">
          <div class="dive-stage">
            <img class="dive-up" src="/img/hero-dsc05325-person.webp" alt="" loading="lazy" decoding="async" data-photo-alt>
            <img class="dive-down" src="/img/hero-dsc05325-person.webp" alt="" loading="lazy" decoding="async" aria-hidden="true">
            <span class="dive-water" aria-hidden="true"></span>
          </div>
        </figure>
        <div class="about-text" data-about></div>
      </div>
      <div class="grid facts-wrap">
        <h3 class="minor" data-t="factsTitle">Ein paar Dinge über mich</h3>
        <ul class="facts" data-facts></ul>
      </div>
    </section>

    <section class="sec" id="projects" aria-labelledby="h-projects">
      <div class="sec-head"><h2 class="sec-word" id="h-projects" data-h="projects">projekte</h2></div>
      <div class="projects" data-projects></div>
    </section>

    <section class="sec" id="certs" aria-labelledby="h-certs">
      <div class="sec-head"><h2 class="sec-word" id="h-certs" data-h="certs">zertifikate</h2></div>
      <div data-certs></div>
    </section>

    <section class="sec" id="cv" aria-labelledby="h-cv">
      <div class="sec-head"><h2 class="sec-word" id="h-cv" data-h="cv">lebenslauf</h2></div>
      <div data-cv></div>
    </section>

    <section class="sec sec-contact" id="contact" aria-labelledby="h-contact">
      <div class="sec-head"><h2 class="sec-word" id="h-contact" data-h="contact">kontakt</h2></div>
      <div class="grid contact" data-contact></div>
    </section>
  </main>

  <footer class="foot">
    <p class="sp-block"><span>Feliks</span><span>Kolomoiets</span></p>
    <p class="sp-date"><span data-city>Regensburg</span> 2026 11</p>
    <div class="lang" role="group" aria-label="Sprache wählen" data-lang-group></div>
  </footer>

  <p class="sr-only" aria-live="polite" data-live></p>

  <script type="module" src="./main.js"></script>
</body>
</html>
