<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feliks Kolomoiets</title>
  <meta name="description" content="Feliks (Felix) Kolomoiets – Lebenslauf, Projekte und Zertifikate.">
  <meta name="theme-color" content="#2d521c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 34%27%3E%3Cpath d=%27M20 31C9 23 3 17 4.5 10.5 6 4.5 13.5 3.5 17 8.5c1.3 1.8 2 3.6 3 5.5 1-3 2.6-6.5 5.8-8 4.4-2 9.6 1.4 9.4 6.6C35 19 27.5 25 20 31Z%27 fill=%27%23e48aa3%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="./style.css">
  <script>/* nur mit JS startet der Name unsichtbar und schreibt sich; ohne JS steht „Feliks“ fertig da */ document.documentElement.classList.add('js');</script>
</head>
<body>
  <!-- Wiese (Canvas) + unscharfe Kopie für die Tiefenunschärfe -->
  <canvas class="grass" id="grass" aria-hidden="true"></canvas>
  <canvas class="grass-blur" id="grassBlur" aria-hidden="true"></canvas>
  <div class="sun" aria-hidden="true"></div>
  <div class="fall" id="fall" aria-hidden="true"></div>

  <div class="lang" role="group" aria-label="Sprache">
    <button type="button" data-lang="de" aria-pressed="true">de</button>
    <button type="button" data-lang="en" aria-pressed="false">en</button>
    <button type="button" data-lang="ru" aria-pressed="false">ru</button>
  </div>

  <button class="music-mini" id="musicMini" type="button" aria-pressed="true" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path class="bd" d="M9 6c-3 0-5 2.4-5 5.4 0 2.6 1.6 4.4 3.6 4.9v7.2c0 1.1.7 1.8 1.6 1.8s1.6-.7 1.6-1.8V8.4C10.8 7 10.1 6 9 6Z"/><path class="w w1" d="M16 12c1.6 1.4 1.6 4.6 0 6"/><path class="w w2" d="M20 9c3 2.8 3 9.2 0 12"/><path class="w w3" d="M24 6.5c4.2 4.2 4.2 12.8 0 17"/></svg>
    <span class="sr-only" data-i="musicOff"></span>
  </button>

  <header class="hero" id="top">
    <!-- Kalenderblätter oben links -->
    <div class="cal drag" data-r="-9">
      <div class="cal-sheet back2"></div>
      <div class="cal-sheet back1"></div>
      <div class="cal-sheet front">
        <p class="cal-month" id="calMonth">November</p>
        <div class="cal-grid" id="calGrid"></div>
        <svg class="cal-heart" viewBox="0 0 40 34" aria-hidden="true"><path d="M20 31C9 23 3 17 4.5 10.5 6 4.5 13.5 3.5 17 8.5c1.3 1.8 2 3.6 3 5.5 1-3 2.6-6.5 5.8-8 4.4-2 9.6 1.4 9.4 6.6C35 19 27.5 25 20 31Z"/></svg>
      </div>
    </div>

    <p class="tagline" data-i="tagline"></p>

    <h1 class="name" id="name">
      <span class="sr-only">Feliks Kolomoiets</span>
      <span class="l1" aria-hidden="true">
        <span class="w w-feliks">Feliks</span>
        <span class="w w-felix">Felix</span>
      </span>
      <span class="l2" aria-hidden="true"><span class="w w-last">Kolomoiets</span></span>
      <svg class="flourish" viewBox="0 0 640 96" aria-hidden="true">
        <path class="fl-line" d="M14 70c52 6 118 9 186-2 44-7 84-22 104-38 12-10 11-24-1-24-14 0-15 20-2 31 22 19 66 26 120 22 70-5 128-26 176-22 22 2 30 15 18 22-10 6-21-2-14-10"/>
        <path class="fl-leaf" d="M592 56c10-14 26-16 34-12-8 12-22 16-34 12Z"/>
        <path class="fl-leaf" d="M58 74c-12-8-26-6-32 0 10 8 24 8 32 0Z"/>
      </svg>
    </h1>

    <div class="lily" id="lily" aria-hidden="true"></div>

    <div class="blanket">
      <div class="plaid" aria-hidden="true"></div>
      <figure class="polaroid drag" data-r="7">
        <div class="ph"><img src="/img/sony-dsc05325-photo.jpg" alt="" width="1200" height="1800" decoding="async" data-i-alt="altHero"></div>
        <svg class="pol-heart" viewBox="0 0 40 34" aria-hidden="true"><path d="M20 31C9 23 3 17 4.5 10.5 6 4.5 13.5 3.5 17 8.5c1.3 1.8 2 3.6 3 5.5 1-3 2.6-6.5 5.8-8 4.4-2 9.6 1.4 9.4 6.6C35 19 27.5 25 20 31Z"/></svg>
      </figure>
      <button class="buds" id="buds" type="button" aria-pressed="false">
        <span class="sr-only" data-i="musicOn"></span>
        <svg viewBox="0 0 320 260" aria-hidden="true">
          <defs>
            <linearGradient id="budG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1efea"/><stop offset="1" stop-color="#cfcbc3"/></linearGradient>
          </defs>
          <g fill="none" stroke="rgba(70,40,45,.25)" stroke-width="4.5" stroke-linecap="round" transform="translate(3 5)">
            <path d="M80 104c6 34 28 52 68 60"/><path d="M212 76c-6 40-30 72-64 88"/><path d="M148 164c-10 22-40 30-46 52-5 20 22 34 60 30 42-4 86 6 140-18"/>
          </g>
          <g fill="none" stroke="#f9f7f3" stroke-width="3.6" stroke-linecap="round">
            <path d="M80 104c6 34 28 52 68 60"/><path d="M212 76c-6 40-30 72-64 88"/><path d="M148 164c-10 22-40 30-46 52-5 20 22 34 60 30 42-4 86 6 140-18"/>
          </g>
          <g transform="rotate(-24 302 228)"><rect x="296" y="222" width="22" height="12" rx="3" fill="url(#budG)" stroke="#b9b3a8"/><rect x="318" y="225" width="14" height="6" rx="2" fill="#c9c6bf" stroke="#9e998f" stroke-width=".8"/></g>
          <rect x="141" y="158" width="14" height="22" rx="5" fill="url(#budG)" stroke="#b9b3a8" stroke-width="1" transform="rotate(14 148 169)"/>
          <g class="bud b1">
            <path d="M60 44c-16 2-24 18-18 32 5 11 17 14 25 12l7 18c2 4 6 5 9 3s4-6 2-9l-9-17c7-6 9-17 3-27-4-8-11-13-19-12Z" fill="url(#budG)" stroke="#b9b3a8" stroke-width="1.2"/>
            <ellipse cx="56" cy="62" rx="9" ry="7" fill="#9d9890" opacity=".5"/>
          </g>
          <g class="bud b2">
            <path d="M236 18c14 6 18 24 9 36-7 10-19 10-27 6l-11 16c-3 3-7 3-9 1-3-3-3-6 0-9l12-15c-5-8-4-19 3-27 6-7 15-11 23-8Z" fill="url(#budG)" stroke="#b9b3a8" stroke-width="1.2"/>
            <ellipse cx="234" cy="38" rx="9" ry="7" fill="#9d9890" opacity=".5"/>
          </g>
          <circle class="ring r1" cx="58" cy="60" r="22"/>
          <circle class="ring r2" cx="234" cy="38" r="22"/>
        </svg>
      </button>
    </div>
    <div class="petals" id="petals" aria-hidden="true"></div>
  </header>

  <main id="diary" class="diary"></main>

  <footer class="foot">
    <p>© 2026 Feliks Kolomoiets</p>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
